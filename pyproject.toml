[project]
name = "think-reason-learn"
version = "0.3.0"
description = "The decision harness for predictions, built as scikit-learn models that use language-model reasoning and show the reasons behind every prediction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vela Research", email = "research@vela.partners" }]
keywords = ["decision-trees", "explainable-ai", "llm", "machine-learning", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "pydantic>=2.11.7,<3",
    "openai>=3.31,<4",
    "numpy>=2.1,<3",  # 2.1: the first with Python 3.13 wheels
    "pandas>=2.3.2,<4",
    "graphviz>=0.21,<0.22",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "tqdm (>=4.68.4,<5.0.0)",
    "httpx2>=2.13,<3",
    "genai-prices>=0.1.13,<0.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.15,<2"]
rl = ["torch>=2.5,<3.0.0"]  # 2.5: the first with Python 3.13 wheels
all = ["anthropic>=1.15,<2", "torch>=2.5,<3.0.0"]

[project.urls]
Homepage = "https://thinkreasonlearn.com/"
Repository = "https://github.com/Vela-Research/think-reason-learn"
Documentation = "https://thinkreasonlearn.com/docs/"

[tool.poetry]
packages = [{ include = "think_reason_learn" }]
include = ["think_reason_learn/py.typed"]


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.1.0"
ruff = "^0.12.12"
pyright = { version = "^1.1.414", extras = ["nodejs"] }
pandas-stubs = ">=2.3,<3"  # pyright strict needs pandas types
sphinx = "^8.2.3"
pre-commit = "^4.3.0"
ipykernel = "^6.30.1"
sphinx-autodoc-typehints = "^3.2.0"
autodoc-pydantic = "^2.2.0"  # For Pydantic model docs in Sphinx
ipywidgets = "^8.1.8"

[tool.poetry.group.docs.dependencies]
furo = "^2025.7.19"  # Latest version as specified
pydata-sphinx-theme = "^0.16.1"
sphinx-design = "^0.6.1"
myst-parser = "^4.0.1"  # if you want Markdown docs

[build-system]
requires = ["poetry-core>=2.2"]  # 2.2 writes License-Expression
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py313" 

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["think_reason_learn", "tests", "docs/source/conf.py"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false  # scikit-learn and graphviz ship none
reportUnnecessaryTypeIgnoreComment = "error"
executionEnvironments = [
  # Tests are white-box: they may read private state.
  { root = "tests", extraPaths = ["."], reportPrivateUsage = false },
  { root = "." },
]

[tool.ruff.lint]
select = ["E", "F", "D", "I", "UP", "B", "BLE", "SIM", "T20", "ERA", "FBT"]
ignore = ["D101", "UP038"]  # UP038: isinstance with X | Y is slower than a tuple

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/*.ipynb" = ["T201"]  # notebooks print their results
"site/**" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
